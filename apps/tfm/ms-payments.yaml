apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-payments
  namespace: tfm
  labels:
    app: ms-payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-payments
  template:
    metadata:
      labels:
        app: ms-payments
    spec:
      containers:
        - name: ms-payments
          image: tfm-ms-payments:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 18002
          env:
            - name: APP_VERSION
              value: "local"
            - name: APP_ENVIRONMENT
              value: "k3s-local"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ms-payments
  namespace: tfm
  labels:
    app: ms-payments
spec:
  selector:
    app: ms-payments
  ports:
    - name: http
      port: 80
      targetPort: http
