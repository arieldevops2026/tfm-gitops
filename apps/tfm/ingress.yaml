# Entrada del tráfico externo. Sustituye al Ingress estándar porque solo un IngressRoute
# de Traefik puede apuntar a un TraefikService (reparto por pesos).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ms-orders
  namespace: tfm
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/api/v1/orders`)
      kind: Rule
      services:
        - name: ms-orders-weighted
          kind: TraefikService
