apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-orders
  namespace: tfm
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/v1/orders
            pathType: Prefix
            backend:
              service:
                name: ms-orders
                port:
                  name: http
