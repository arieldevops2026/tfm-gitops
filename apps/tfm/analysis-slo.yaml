# Comprobación de SLO de la versión canary de ms-orders (escenario B1).
# El Rollout la ejecuta tras cada aumento de tráfico: si cumple avanza, si falla aborta,
# y si no hay datos suficientes queda inconclusa y el Rollout se pausa.
#
# Ventana de evaluación: 5 minutos. Las consultas miran los últimos 5 min de la versión canary
# y se miden 3 veces (cada 30 s) tras esperar 4 min, de modo que al evaluar ya hay ventana completa.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: slo-ms-orders
  namespace: tfm
spec:
  args:
    # Hash del pod template de la versión canary. Lo rellena el Rollout y es lo que separa
    # las métricas de la versión nueva de las de la estable (etiqueta rollout_hash en Prometheus).
    - name: canary-hash
  metrics:
    # SLO 1: latencia p95 < 500 ms
    - name: latencia-p95
      initialDelay: 4m
      interval: 30s
      count: 3
      failureLimit: 0
      successCondition: len(result) > 0 && result[0] < 0.5
      failureCondition: len(result) > 0 && result[0] >= 0.5
      provider:
        prometheus:
          address: http://prometheus.observability.svc.cluster.local:9090
          query: |
            histogram_quantile(0.95, sum by (le) (
              rate(http_server_requests_seconds_bucket{service_name="ms-orders", uri="/orders/create", rollout_hash="{{args.canary-hash}}"}[5m])))

    # SLO 2: errores 5xx < 1 %
    - name: errores-5xx
      initialDelay: 4m
      interval: 30s
      count: 3
      failureLimit: 0
      successCondition: len(result) > 0 && result[0] < 1
      failureCondition: len(result) > 0 && result[0] >= 1
      provider:
        prometheus:
          address: http://prometheus.observability.svc.cluster.local:9090
          query: |
            100 * (sum(increase(http_server_requests_seconds_count{service_name="ms-orders", uri="/orders/create", rollout_hash="{{args.canary-hash}}", status=~"5.."}[5m])) or vector(0))
              / sum(increase(http_server_requests_seconds_count{service_name="ms-orders", uri="/orders/create", rollout_hash="{{args.canary-hash}}"}[5m]))

    # Mínimo de peticiones: con menos de 500 no hay base estadística. No es un fallo de la versión:
    # el resultado queda inconcluso (ni éxito ni fallo) y el Rollout se pausa.
    - name: volumen-minimo
      initialDelay: 4m
      interval: 30s
      count: 3
      failureLimit: 0
      successCondition: len(result) > 0 && result[0] >= 500
      failureCondition: len(result) > 0 && result[0] < 0   # nunca se cumple a propósito
      provider:
        prometheus:
          address: http://prometheus.observability.svc.cluster.local:9090
          query: |
            sum(increase(http_server_requests_seconds_count{service_name="ms-orders", uri="/orders/create", rollout_hash="{{args.canary-hash}}"}[5m]))
