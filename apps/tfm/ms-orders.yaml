apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-orders
  namespace: tfm
  labels:
    app: ms-orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-orders
  template:
    metadata:
      labels:
        app: ms-orders
    spec:
      containers:
        - name: ms-orders
          image: tfm-ms-orders:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 18000
          env:
            - name: APP_VERSION
              value: "local"
            - name: APP_ENVIRONMENT
              value: "k3s-local"
            - name: QUARKUS_OTEL_SDK_DISABLED
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
            - name: MS_PRODUCTS_URL
              value: "http://ms-products.tfm.svc.cluster.local/api/v1/"
            - name: MS_PAYMENTS_URL
              value: "http://ms-payments.tfm.svc.cluster.local/api/v1/"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ms-orders
  namespace: tfm
  labels:
    app: ms-orders
spec:
  selector:
    app: ms-orders
  ports:
    - name: http
      port: 80
      targetPort: http
