apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ms-orders
  namespace: tfm
  labels:
    app: ms-orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-orders
  # Escenario B1: canary gobernado por SLO.
  # Tras cada subida de tráfico: 1 min de estabilización y un análisis (AnalysisTemplate slo-ms-orders).
  # Si el análisis falla, el Rollout aborta y el tráfico vuelve a la versión estable.
  # Traefik reparte el tráfico entre ms-orders (estable) y ms-orders-canary (versión nueva).
  strategy:
    canary:
      stableService: ms-orders
      canaryService: ms-orders-canary
      trafficRouting:
        traefik:
          weightedTraefikServiceName: ms-orders-weighted
      steps:
        - setWeight: 10
        - pause: {duration: 1m}
        - analysis:
            templates:
              - templateName: slo-ms-orders
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause: {duration: 1m}
        - analysis:
            templates:
              - templateName: slo-ms-orders
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        # tras el último análisis la versión nueva pasa al 100 %
  template:
    metadata:
      labels:
        app: ms-orders
    spec:
      containers:
        - name: ms-orders
          image: tfm-ms-orders:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 18000
          env:
            - name: APP_VERSION
              value: "v4"
            - name: APP_ENVIRONMENT
              value: "k3s-local"
            - name: QUARKUS_OTEL_SDK_DISABLED
              value: "false"
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
            - name: MS_PRODUCTS_URL
              value: "http://ms-products.tfm.svc.cluster.local/api/v1/"
            - name: MS_PAYMENTS_URL
              value: "http://ms-payments.tfm.svc.cluster.local/api/v1/"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ms-orders
  namespace: tfm
  labels:
    app: ms-orders
spec:
  selector:
    app: ms-orders
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: ms-orders-canary
  namespace: tfm
  labels:
    app: ms-orders
spec:
  selector:
    app: ms-orders
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Reparto de tráfico por pesos. Los pesos NO se escriben aquí: los cambia Argo Rollouts,
# y si estuvieran en Git, Argo CD marcaría el recurso como OutOfSync.
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: ms-orders-weighted
  namespace: tfm
spec:
  weighted:
    services:
      - name: ms-orders
        port: 80
      - name: ms-orders-canary
        port: 80
