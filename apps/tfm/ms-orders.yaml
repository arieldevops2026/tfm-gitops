apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ms-orders
  namespace: tfm
  labels:
    app: ms-orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-orders
  # B0: actualización gradual de pods, sin canary ni análisis de SLO
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ms-orders
    spec:
      containers:
        - name: ms-orders
          image: tfm-ms-orders:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 18000
          env:
            - name: APP_VERSION
              value: "local"
            - name: APP_ENVIRONMENT
              value: "k3s-local"
            - name: MS_PRODUCTS_URL
              value: "http://ms-products.tfm.svc.cluster.local/api/v1/"
            - name: MS_PAYMENTS_URL
              value: "http://ms-payments.tfm.svc.cluster.local/api/v1/"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ms-orders
  namespace: tfm
  labels:
    app: ms-orders
spec:
  selector:
    app: ms-orders
  ports:
    - name: http
      port: 80
      targetPort: http
