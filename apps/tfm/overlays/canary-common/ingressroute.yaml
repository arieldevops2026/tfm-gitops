# B1 y B2: el tráfico pasa por el TraefikService, que lo reparte entre estable y canary
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ms-orders
  namespace: tfm
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/api/v1/orders`)
      kind: Rule
      services:
        - name: ms-orders-weighted
          kind: TraefikService
