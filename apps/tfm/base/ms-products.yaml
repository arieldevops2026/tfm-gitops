apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-products
  namespace: tfm
  labels:
    app: ms-products
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-products
  template:
    metadata:
      labels:
        app: ms-products
    spec:
      containers:
        - name: ms-products
          image: ghcr.io/arieldevops2026/tfm-ms-products@sha256:f1f658bfe2e9743ca5be461682ebee1a9a8b59a9c42ba0aaaa869ba3498a1cf7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18001
          env:
            - name: APP_VERSION
              value: "df26c83"
            - name: APP_ENVIRONMENT
              value: "k3s-local"
            - name: QUARKUS_OTEL_SDK_DISABLED
              value: "false"
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ms-products
  namespace: tfm
  labels:
    app: ms-products
spec:
  selector:
    app: ms-products
  ports:
    - name: http
      port: 80
      targetPort: http
