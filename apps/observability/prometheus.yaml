# Prometheus: lee (scrape) las métricas de los microservicios y las guarda.
# Es la fuente de datos de los SLO que consultará Argo Rollouts.

# Permisos para que Prometheus pueda preguntar a la API de Kubernetes qué pods existen
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      # Cada cuánto lee las métricas. Más corto = el canary detecta antes, pero se guardan más datos.
      scrape_interval: 10s
      scrape_timeout: 5s
    scrape_configs:
      # Los microservicios: Prometheus los descubre solo, preguntando a Kubernetes por los pods
      # del namespace tfm que tengan el puerto "http".
      - job_name: tfm-services
        metrics_path: /q/metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [tfm]
        relabel_configs:
          # Solo pods con una etiqueta "app" (los tres microservicios)
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: ms-.+
            action: keep
          # Solo el puerto llamado "http"
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          # Etiquetas útiles para consultar y comparar versiones (stable vs canary)
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
            target_label: rollout_hash
      # El propio Prometheus
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate   # un solo pod escribe en el almacenamiento: no puede haber dos a la vez
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsUser: 65534
        runAsNonRoot: true
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}   # datos efímeros: se pierden si el pod se recrea (decisión del TFM)
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
